name: Auto Boss

on:
  workflow_dispatch:

jobs:
  boss:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Boss
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          npm install
          npx playwright install chromium
          node index.js

      - name: Run Farm
        if: success()
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          node farm.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore
