name: Auto Boss

on:
  workflow_dispatch:

jobs:
  boss:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LANG: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Install Chinese locale
        run: |
          sudo apt-get update && sudo apt-get install -y locales
          sudo locale-gen zh_CN.UTF-8
          sudo update-locale LANG=zh_CN.UTF-8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Boss
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          npm install
          npx playwright install chromium
          node index.js

      - name: Run Farm
        if: success()
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          node farm.js
