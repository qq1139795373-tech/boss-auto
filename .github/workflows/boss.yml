name: Auto Boss

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'BOSS_FORCE: 跳过时间闸门（测试登录+导航用）'
        type: boolean
        default: false
      nav_dest:
        description: '测试用：航行目的地（默认孟买，如 广州）'
        type: string
        default: ''
      nav_region:
        description: '测试用：出航区域标签（如 东亚/印度洋）'
        type: string
        default: ''
      test_fallback:
        description: '测试用：跳过出航直接走传送兜底'
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          JSON: ${{ secrets.GAME_ACCOUNTS_JSON }}
        run: |
          if [ -z "$JSON" ]; then
            echo "错误: 仓库 secret GAME_ACCOUNTS_JSON 未配置"
            exit 1
          fi
          if ! echo "$JSON" | jq -e 'type=="array" and length>0' >/dev/null; then
            echo "错误: GAME_ACCOUNTS_JSON 应为非空JSON数组"
            exit 1
          fi
          echo "matrix=$(echo "$JSON" | jq -c '[range(length)]')" >> "$GITHUB_OUTPUT"

  boss:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        idx: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GAME_ACCOUNTS_JSON: ${{ secrets.GAME_ACCOUNTS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析第idx个账号
        run: |
          echo "GAME_ACCOUNT=$(echo "$GAME_ACCOUNTS_JSON" | jq -r '.[${{ matrix.idx }}].account')" >> "$GITHUB_ENV"
          echo "GAME_PASSWORD=$(echo "$GAME_ACCOUNTS_JSON" | jq -r '.[${{ matrix.idx }}].password')" >> "$GITHUB_ENV"

      - name: Run Boss
        env:
          BOSS_FORCE: ${{ inputs.force }}
          NAV_DEST: ${{ inputs.nav_dest }}
          NAV_REGION: ${{ inputs.nav_region }}
          TEST_FALLBACK: ${{ inputs.test_fallback }}
        run: |
          npm install
          npx playwright install chromium
          node index.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.idx }}
          path: "*.png"
          if-no-files-found: ignore
          compression-level: 6
          overwrite: false
