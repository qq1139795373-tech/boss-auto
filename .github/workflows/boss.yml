name: Auto Boss

on:
  workflow_dispatch:
    inputs:
      tasks_mode:
        description: '任务流程：auto按北京时间(00:00竞技场钓鱼/18:00山寨)，或强制 dawn/dusk/skip'
        type: string
        default: 'auto'

jobs:
  boss:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup
        run: |
          npm install
          npx playwright install chromium

      - name: Run Tasks
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
          TASKS_MODE: ${{ inputs.tasks_mode }}
        run: node tasks.js

      - name: Run Boss
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: node index.js

      - name: Run Farm
        if: success()
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          node farm.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore
