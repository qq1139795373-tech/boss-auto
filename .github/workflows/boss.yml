name: Auto Boss

on:
  schedule:
    - cron: '50 3 * * *'  # 备用：UTC 03:50 = 北京时间11:50
  workflow_dispatch:       # 主要：外部触发

jobs:
  boss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and run
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          npm install
          npx playwright install chromium
          node index.js
