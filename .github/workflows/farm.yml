name: Auto Farm

on:
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and run
        env:
          GAME_ACCOUNT: ${{ secrets.GAME_ACCOUNT }}
          GAME_PASSWORD: ${{ secrets.GAME_PASSWORD }}
        run: |
          npm install
          npx playwright install chromium
          node farm.js
